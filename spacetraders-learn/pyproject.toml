[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stlearn"
version = "0.1.0"
description = "Learn data ingestion by playing SpaceTraders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
stlearn = "stlearn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stlearn = ["warehouse/schema.sql"]
